<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>9/2 回収マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.panel{position:absolute;z-index:1000;top:10px;left:10px;right:10px;max-width:520px;background:#fff;border-radius:14px;box-shadow:0 2px 14px #0005;padding:8px}
.head{display:flex;gap:7px;align-items:center}.head b{flex:1;font-size:18px}.btn{border:0;border-radius:9px;padding:10px 12px;background:#1677ff;color:#fff;font-weight:800}.close{background:#555}
.notice{font-size:11px;background:#fff3cd;padding:6px 8px;border-radius:7px;margin-top:6px;line-height:1.45}
.status{font-size:11px;background:#eef5ff;padding:6px 8px;border-radius:7px;margin-top:6px;line-height:1.4;color:#234}
.list{max-height:39vh;overflow:auto;margin-top:7px}.item{display:flex;gap:8px;padding:8px 3px;border-top:1px solid #eee;font-size:13px;align-items:center}.num{min-width:30px;height:30px;border-radius:50%;background:#e53935;color:#fff;display:grid;place-items:center;font-weight:900;cursor:pointer}.done .num{background:#2e7d32}.txt{flex:1;cursor:pointer}.small{font-size:11px;color:#666;line-height:1.35}.done .txt{text-decoration:line-through;opacity:.65}.complete{border:0;border-radius:7px;padding:7px 8px;font-weight:700;cursor:pointer;background:#eee}.complete.donebtn{background:#dff3e2;color:#14532d}
.leaflet-div-icon{background:transparent;border:0}.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;background:#e53935;color:#fff;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid white;box-shadow:0 2px 5px #0007}.pin span{transform:rotate(45deg);font-weight:900;font-size:14px}.pin.done{background:#2e7d32}.gpsdot{width:18px;height:18px;background:#1677ff;border:4px solid white;border-radius:50%;box-shadow:0 0 0 2px #1677ff66}
#openList{display:none;position:absolute;z-index:1000;top:12px;left:12px;border:0;border-radius:10px;background:#111;color:white;padding:11px 14px;font-weight:800;box-shadow:0 2px 10px #0005}
#gpsFloat{position:absolute;z-index:1001;right:12px;bottom:28px;border:0;border-radius:999px;background:#1677ff;color:#fff;padding:13px 16px;font-weight:900;box-shadow:0 2px 12px #0005}
.unresolved{opacity:.78}.loading{color:#1677ff;font-weight:700}
</style></head><body>
<div id="map"></div>
<button id="openList">一覧を開く</button>
<button id="gpsFloat">GPS</button>
<div class="panel" id="panel">
  <div class="head"><b>9/2 回収マップ（全16件）</b><button class="btn" id="gps">GPS</button><button class="btn close" id="closeList">閉じる</button></div>
  <div class="notice">いつもの仕様です。番号を押すとナビ開始、本文を押すとその地点へ移動、回収済みで緑色になります。全16件のピンを最初から表示します。番号を押すとGoogleマップで住所ナビを開始します。</div>
  <div class="status" id="status">ピン位置を読み込み中…</div>
  <div class="list" id="list"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const jobs=[
{n:1,no:'CM00254397',name:'森（モリ）',addr:'熊本県熊本市南区刈草3丁目1-1 サンライフウエスト201号室',place:'ごみステーション',note:'',item:'テレビ',lat:32.7594,lon:130.681},
{n:2,no:'CM00254494',name:'吉岡（ヨシオカ）',addr:'熊本県熊本市南区野田3-9-140',place:'自宅前',note:'',item:'冷蔵庫',lat:32.7245,lon:130.692},
{n:3,no:'CM00258322',name:'田中（タナカ）',addr:'熊本県熊本市南区今町678-3',place:'自宅前',note:'',item:'冷蔵庫',lat:32.7445,lon:130.6405},
{n:4,no:'CM00258975',name:'中村（ナカムラ）',addr:'熊本県熊本市西区谷尾崎町20-1',place:'自宅前',note:'',item:'テレビ',lat:32.797,lon:130.6735},
{n:5,no:'CM00259319',name:'松本（マツモト）',addr:'熊本県熊本市西区田崎2-3-86 504',place:'ごみステーション',note:'',item:'テレビ',lat:32.7837,lon:130.6842},
{n:6,no:'CM00262274',name:'金子（カネコ）',addr:'熊本県熊本市西区田崎1丁目5-115 ホワイトキャッスル田崎506',place:'ごみステーション',note:'',item:'テレビ',lat:32.7817,lon:130.6814},
{n:7,no:'CM00262869',name:'浅井（アサイ）',addr:'熊本県熊本市西区田崎1丁目3-26',place:'自宅前',note:'',item:'テレビ',lat:32.783,lon:130.6848},
{n:8,no:'CM00263094',name:'中山（ナカヤマ）',addr:'熊本県熊本市西区春日一丁目8番14号 サンシャインプラザ熊本駅通1003',place:'ごみステーション',note:'',item:'テレビ',lat:32.7916,lon:130.6962},
{n:9,no:'CM00263120',name:'井上（イノウエ）',addr:'熊本県熊本市西区沖新町102',place:'自宅前',note:'',item:'テレビ、洗濯機',lat:32.75,lon:130.5667},
{n:10,no:'CM00264244',name:'藤木（フジキ）',addr:'熊本県熊本市西区田崎2丁目4-19 プレアール田崎607号',place:'ごみステーション',note:'',item:'テレビ',lat:32.781,lon:130.6826},
{n:11,no:'CM00266366',name:'森本（モリモト）',addr:'熊本県熊本市西区田崎3-2-46',place:'自宅前',note:'',item:'テレビ',lat:32.78,lon:130.6808},
{n:12,no:'CM00267639',name:'上野（ウエノ）',addr:'熊本県熊本市西区谷尾崎町74-2 いしがみハウス B102',place:'ごみステーション',note:'',item:'テレビ',lat:32.7977,lon:130.6747},
{n:13,no:'CM00267843',name:'井立（イダテ）',addr:'熊本県熊本市西区上熊本2丁目2-24 コアマンション藤崎台',place:'ごみステーション',note:'',item:'テレビ',lat:32.81,lon:130.699},
{n:14,no:'CM00268561',name:'山内（ヤマウチ）',addr:'熊本県熊本市南区野田1-8-20',place:'自宅前',note:'',item:'テレビ',lat:32.7175,lon:130.6915},
{n:15,no:'CM00269167',name:'松倉（マツクラ）',addr:'熊本県熊本市西区田崎本町3-25',place:'自宅前',note:'',item:'テレビ',lat:32.7865,lon:130.6855},
{n:16,no:'CM00272550',name:'田中（タナカ）',addr:'熊本県熊本市南区近見3丁目7-30',place:'自宅前',note:'',item:'テレビ',lat:32.7655,lon:130.6995}
];

const map=L.map('map',{zoomControl:true}).setView([32.793,130.707],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);

const done=JSON.parse(localStorage.getItem('done0902')||'{}');
const geoCache=JSON.parse(localStorage.getItem('geo0902')||'{}');
const markers={}; let gpsMarker=null, watchId=null;

function icon(j){return L.divIcon({html:`<div class="pin ${done[j.n]?'done':''}"><span>${j.n}</span></div>`,iconSize:[40,40],iconAnchor:[20,38]})}
function saveDone(){localStorage.setItem('done0902',JSON.stringify(done))}
function saveGeo(){localStorage.setItem('geo0902',JSON.stringify(geoCache))}
function navTo(j){location.href=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(j.addr)}`}
window.navTo=navTo;

function popup(j){
  return `<b>${j.n}. ${j.name}</b><br>${j.addr}<br>受付番号：${j.no}<br>排出場所：${j.place||'未記載'}${j.note?` / ${j.note}`:''}<br>品目：${j.item}<br><button onclick="navTo(jobs[${j.n-1}])" style="margin-top:6px;padding:7px 10px;background:#1677ff;color:#fff;border:0;border-radius:7px;font-weight:800">ナビ開始</button> <button onclick="toggleDone(${j.n})" style="margin-top:6px;padding:7px 10px">回収済み切替</button>`
}

function renderList(){
  const el=document.getElementById('list'); el.innerHTML='';
  jobs.forEach(j=>{
    const ready=!!(j.lat&&j.lon);
    const d=document.createElement('div');
    d.className='item '+(done[j.n]?'done ':'')+(ready?'':'unresolved');
    d.innerHTML=`<div class="num" title="ナビ開始">${j.n}</div><div class="txt"><b>${j.name}</b>　${j.item}<div class="small">${j.addr}</div><div class="small">${j.place||'未記載'}${j.note?` / ${j.note}`:''}${ready?'':' / <span class="loading">位置取得中…</span>'}</div></div><button class="complete ${done[j.n]?'donebtn':''}">${done[j.n]?'戻す':'回収済み'}</button>`;
    d.querySelector('.complete').onclick=()=>toggleDone(j.n);
    d.querySelector('.num').onclick=()=>navTo(j);
    d.querySelector('.txt').onclick=()=>{
      if(j.lat&&j.lon){map.flyTo([j.lat,j.lon],18); if(markers[j.n]) markers[j.n].openPopup();}
      else {navTo(j);} // 位置未取得ならナビを優先
    };
    el.appendChild(d);
  });
}

window.toggleDone=(n)=>{
  done[n]=!done[n]; saveDone(); renderList();
  const j=jobs[n-1]; if(markers[n]){markers[n].setIcon(icon(j)); markers[n].setPopupContent(popup(j));}
}

function updateStatus(){
  const unresolved=jobs.filter(j=>!(j.lat&&j.lon)).length;
  document.getElementById('status').textContent = unresolved===0 ? '全件のピン位置を読み込みました。' : `ピン位置を読み込み中… ${jobs.length-unresolved}/${jobs.length}`;
}

function addOrUpdateMarker(j){
  if(!j.lat||!j.lon) return;
  if(markers[j.n]){
    markers[j.n].setLatLng([j.lat,j.lon]);
    markers[j.n].setIcon(icon(j));
    markers[j.n].setPopupContent(popup(j));
  } else {
    markers[j.n]=L.marker([j.lat,j.lon],{icon:icon(j)}).addTo(map).bindPopup(popup(j));
  }
}

function fitIfPossible(){
  const pts=jobs.filter(j=>j.lat&&j.lon).map(j=>[j.lat,j.lon]);
  if(pts.length>=2) map.fitBounds(L.latLngBounds(pts),{padding:[35,35]});
  else if(pts.length===1) map.setView(pts[0],16);
}

async function geocodeOne(j){
  if(geoCache[j.addr]){
    j.lat=geoCache[j.addr].lat; j.lon=geoCache[j.addr].lon;
    addOrUpdateMarker(j); updateStatus(); renderList(); return;
  }
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(j.addr);
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data=await res.json();
  if(data && data.length){
    j.lat=parseFloat(data[0].lat); j.lon=parseFloat(data[0].lon);
    geoCache[j.addr]={lat:j.lat,lon:j.lon}; saveGeo();
    addOrUpdateMarker(j); fitIfPossible();
  }
  updateStatus(); renderList();
}

async function geocodeAll(){
  updateStatus(); renderList();
  for(const j of jobs){
    if(j.lat&&j.lon) continue;
    try{ await geocodeOne(j); }catch(e){ console.log('geocode fail',j.addr,e); updateStatus(); renderList(); }
    await new Promise(r=>setTimeout(r,900));
  }
  fitIfPossible(); updateStatus(); renderList();
}

jobs.forEach(j=>{ if(geoCache[j.addr]){ j.lat=geoCache[j.addr].lat; j.lon=geoCache[j.addr].lon; addOrUpdateMarker(j); } });
jobs.forEach(j=>addOrUpdateMarker(j)); renderList(); fitIfPossible(); updateStatus();

document.getElementById('closeList').onclick=()=>{document.getElementById('panel').style.display='none';document.getElementById('openList').style.display='block'};
document.getElementById('openList').onclick=()=>{document.getElementById('panel').style.display='block';document.getElementById('openList').style.display='none'};

function startGPS(){
  if(!navigator.geolocation) return alert('GPSを利用できません');
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; alert('GPS追従を停止しました'); return; }
  watchId=navigator.geolocation.watchPosition(
    p=>{
      const ll=[p.coords.latitude,p.coords.longitude];
      if(!gpsMarker){ gpsMarker=L.marker(ll,{icon:L.divIcon({html:'<div class="gpsdot"></div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map).bindPopup('現在地'); }
      else { gpsMarker.setLatLng(ll); }
      map.setView(ll,16);
    },
    e=>alert('位置情報を許可してください。iPhoneの設定→Safari→位置情報も確認してください。'),
    {enableHighAccuracy:true,maximumAge:2000,timeout:15000}
  );
}

document.getElementById('gps').onclick=startGPS;
document.getElementById('gpsFloat').onclick=startGPS;
</script></body></html>
