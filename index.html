<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>9/4 回収マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <style>
    html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background:#f2f4f7; }
    #map { height: 100%; width: 100%; }
    .topbar {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000;
      display: flex; gap: 8px; align-items: flex-start; pointer-events:none;
    }
    .panel {
      background: rgba(255,255,255,0.96); border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,.18);
      pointer-events:auto;
    }
    .info-panel { flex: 1; padding: 12px 14px; }
    .title-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
    .title { font-size: 26px; font-weight: 800; line-height:1.1; }
    .sub { font-size: 13px; color:#555; line-height:1.5; }
    .status { margin-top:8px; padding:10px 12px; background:#eef4ff; border-radius:10px; font-size:13px; color:#1d3d7a; }
    .btn-col { display:flex; flex-direction:column; gap:8px; }
    .btn {
      border:0; border-radius:12px; padding:12px 14px; font-size:15px; font-weight:700; cursor:pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .btn-blue { background:#1f6fff; color:#fff; }
    .btn-dark { background:#4a4a4a; color:#fff; }
    .btn-white { background:#fff; color:#222; }
    .floating-gps {
      position: fixed; right: 12px; bottom: 22px; z-index: 1000;
      background:#1f6fff; color:#fff; border:none; border-radius:28px; padding:16px 18px; font-size:20px; font-weight:800;
      box-shadow:0 6px 16px rgba(0,0,0,.22); cursor:pointer;
    }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(88vw, 390px); z-index: 1200;
      background: #fff; box-shadow: 4px 0 18px rgba(0,0,0,.2); transform: translateX(-105%); transition: transform .25s ease;
      display:flex; flex-direction:column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header { padding:16px 16px 10px; border-bottom:1px solid #e7e7e7; }
    .drawer-title { font-size:22px; font-weight:800; }
    .drawer-sub { font-size:13px; color:#555; margin-top:4px; }
    .drawer-body { overflow:auto; padding: 10px 12px 16px; }
    .item {
      border:1px solid #e4e7eb; border-radius:14px; margin-bottom:10px; padding:10px 12px; background:#fff;
    }
    .item.done { background:#ecfff1; border-color:#87d99a; }
    .item-head { display:flex; align-items:center; gap:10px; }
    .num-badge {
      min-width:34px; height:34px; border-radius:50%; background:#e53935; color:#fff; display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:16px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
    }
    .item.done .num-badge { background:#23a559; }
    .item-main { flex:1; }
    .name { font-weight:800; font-size:15px; }
    .addr { font-size:13px; color:#444; margin-top:3px; line-height:1.45; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .small-btn {
      border:none; border-radius:10px; padding:8px 10px; font-size:13px; font-weight:700; cursor:pointer;
      background:#edf2ff; color:#1343a5;
    }
    .small-btn.secondary { background:#f2f2f2; color:#333; }
    .small-btn.donebtn { background:#e8f8ed; color:#187a3f; }
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,.22); z-index:1100; display:none; }
    .overlay.show { display:block; }
    .marker-pin {
      width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      background: #e53935; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35);
      position: relative;
    }
    .marker-pin.done { background: #23a559; }
    .marker-pin span {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center; transform: rotate(45deg);
      color:#fff; font-weight:800; font-size:16px;
    }
    .leaflet-popup-content { margin: 12px 14px; }
    .popup-title { font-size:16px; font-weight:800; margin-bottom:6px; }
    .popup-addr { font-size:13px; line-height:1.5; margin-bottom:10px; }
    .popup-row { display:flex; gap:8px; flex-wrap:wrap; }
    .popup-btn {
      display:inline-block; background:#1f6fff; color:#fff!important; text-decoration:none; border-radius:10px; padding:8px 10px; font-weight:800; font-size:13px;
    }
    .popup-btn.gray { background:#555; }
    @media (max-width: 640px) {
      .title { font-size: 20px; }
      .sub { font-size:12px; }
      .info-panel { padding:10px 12px; }
      .btn { padding:10px 12px; font-size:14px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="panel info-panel" id="infoBox">
      <div class="title-row">
        <div>
          <div class="title">9/4 回収マップ（9件）</div>
          <div class="sub">上から順に①〜⑨。番号ピンを最初から表示、GPS付き。番号または一覧から地点へ移動、ナビ開始、回収済み切替ができます。</div>
        </div>
        <div class="btn-col">
          <button class="btn btn-blue" onclick="locateUser()">GPS</button>
          <button class="btn btn-dark" onclick="toggleDrawer(true)">一覧</button>
        </div>
      </div>
      <div class="status" id="statusBox">ピン位置を読み込み中…</div>
    </div>
  </div>

  <button class="floating-gps" onclick="locateUser()">GPS</button>

  <div class="overlay" id="overlay" onclick="toggleDrawer(false)"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="drawer-title">回収先一覧</div>
      <div class="drawer-sub">タップで地点へ移動。ナビ開始と回収済み切替もできます。</div>
    </div>
    <div class="drawer-body" id="listContainer"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const spots = [
      {no:1, name:'金坂（キンジョウ）', address:'熊本市中央区白山2-1-1 白山堂ビル504'},
      {no:2, name:'本田（ホンダ）', address:'熊本市中央区九品寺2-4-10 グランフォーレ九品寺テラス'},
      {no:3, name:'林田（ハヤシダ）', address:'熊本市中央区国府本町12-93'},
      {no:4, name:'柏木（カシワギ）', address:'熊本市中央区渡鹿4-13-51 メイン石井501'},
      {no:5, name:'丸木（マルキ）', address:'熊本市中央区萩原町9-62 県営萩原団地6棟501号'},
      {no:6, name:'嶋松（ミネマツ）', address:'熊本市中央区島崎1-21-12 シティハイム草山402'},
      {no:7, name:'大石（オオイシ）', address:'熊本市中央区米屋町3丁目15-2 エクシーマンション1402号'},
      {no:8, name:'吉村（ヨシムラ）', address:'熊本市中央区水前寺4丁目29-15'},
      {no:9, name:'坂梨（サカナシ）', address:'熊本市中央区国府本町12-17 西村ビル205'}
    ];

    const map = L.map('map', { zoomControl:true }).setView([32.7900, 130.7250], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const markers = {};
    const listContainer = document.getElementById('listContainer');
    const statusBox = document.getElementById('statusBox');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    const doneKey = 'kumamoto_collection_done_2026_09_04';
    let doneState = JSON.parse(localStorage.getItem(doneKey) || '{}');
    let userMarker = null, userCircle = null;

    function googleNavUrl(address){
      return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(address) + '&travelmode=driving';
    }

    function googleSearchUrl(address){
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
    }

    function markerHtml(no, done){
      return `<div class="marker-pin ${done ? 'done':''}"><span>${no}</span></div>`;
    }

    function iconFor(no, done){
      return L.divIcon({
        className: '',
        html: markerHtml(no, done),
        iconSize: [34, 34],
        iconAnchor: [17, 33],
        popupAnchor: [0, -30]
      });
    }

    function saveDone() {
      localStorage.setItem(doneKey, JSON.stringify(doneState));
    }

    function toggleDone(no) {
      doneState[no] = !doneState[no];
      saveDone();
      if (markers[no]) markers[no].setIcon(iconFor(no, !!doneState[no]));
      renderList();
      if (markers[no]) markers[no].setPopupContent(buildPopup(spots.find(s=>s.no===no)));
      updateStatus();
    }

    function buildPopup(spot){
      const done = !!doneState[spot.no];
      return `
        <div class="popup-title">${spot.no}. ${spot.name}</div>
        <div class="popup-addr">${spot.address}</div>
        <div class="popup-row">
          <a class="popup-btn" target="_blank" href="${googleNavUrl(spot.address)}">ナビ開始</a>
          <a class="popup-btn gray" target="_blank" href="${googleSearchUrl(spot.address)}">Googleマップで開く</a>
          <a class="popup-btn ${done ? 'gray':''}" href="javascript:void(0)" onclick="toggleDone(${spot.no})">${done ? '未回収に戻す':'回収済みにする'}</a>
        </div>`;
    }

    function toggleDrawer(show) {
      drawer.classList.toggle('open', show);
      overlay.classList.toggle('show', show);
    }

    function centerOn(no) {
      const m = markers[no];
      if (m) {
        map.setView(m.getLatLng(), 17, {animate:true});
        m.openPopup();
      }
    }

    function renderList() {
      listContainer.innerHTML = '';
      spots.forEach(spot => {
        const done = !!doneState[spot.no];
        const div = document.createElement('div');
        div.className = 'item' + (done ? ' done' : '');
        div.innerHTML = `
          <div class="item-head">
            <div class="num-badge">${spot.no}</div>
            <div class="item-main">
              <div class="name">${spot.name}</div>
              <div class="addr">${spot.address}</div>
            </div>
          </div>
          <div class="controls">
            <button class="small-btn" onclick="centerOn(${spot.no})">地図で見る</button>
            <a class="small-btn" style="text-decoration:none" target="_blank" href="${googleNavUrl(spot.address)}">ナビ開始</a>
            <button class="small-btn donebtn" onclick="toggleDone(${spot.no})">${done ? '未回収に戻す' : '回収済み'}</button>
          </div>`;
        listContainer.appendChild(div);
      });
    }

    function updateStatus(text='') {
      const total = spots.length;
      const done = spots.filter(s => !!doneState[s.no]).length;
      const loaded = Object.keys(markers).length;
      statusBox.textContent = text || `ピン表示 ${loaded}/${total}件 ・ 回収済み ${done}/${total}件`;
    }

    async function fetchJson(url) {
      const res = await fetch(url, { headers:{'Accept':'application/json'} });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    function baseAddress(address) {
      // 建物名・号室をなるべく除いた住所を作る
      let a = address.trim();
      if (a.includes(' ')) a = a.split(' ')[0];
      a = a.replace(/(\d+)号$/, '');
      return a;
    }

    async function geocode(address) {
      const variants = Array.from(new Set([
        address,
        '熊本県' + address,
        baseAddress(address),
        '熊本県' + baseAddress(address)
      ]));

      for (const q of variants) {
        const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&q=' + encodeURIComponent(q);
        try {
          const data = await fetchJson(url);
          if (Array.isArray(data) && data.length) {
            return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), query: q };
          }
        } catch (e) {}
        await new Promise(r => setTimeout(r, 400));
      }
      throw new Error('geocode failed');
    }

    async function loadPins() {
      const bounds = [];
      let success = 0;
      const failed = [];

      for (const spot of spots) {
        updateStatus(`ピン位置を読み込み中… ${spot.no}/${spots.length}`);
        try {
          const pos = await geocode(spot.address);
          const marker = L.marker([pos.lat, pos.lon], { icon: iconFor(spot.no, !!doneState[spot.no]) }).addTo(map);
          marker.bindPopup(buildPopup(spot));
          marker.on('click', () => marker.openPopup());
          markers[spot.no] = marker;
          bounds.push([pos.lat, pos.lon]);
          success++;
        } catch (e) {
          failed.push(spot.no);
        }
        renderList();
      }

      if (bounds.length) {
        map.fitBounds(bounds, { padding:[44, 44] });
      }

      if (failed.length) {
        updateStatus(`ピン表示 ${success}/${spots.length}件。未表示: ${failed.join(', ')}。一覧からナビは利用できます。`);
      } else {
        updateStatus(`全${spots.length}件のピンを表示しました。番号を押すとナビ開始できます。`);
      }
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert('この端末ではGPSが使えません。');
        return;
      }
      statusBox.textContent = '現在地を取得中…';
      navigator.geolocation.getCurrentPosition((pos) => {
        const latlng = [pos.coords.latitude, pos.coords.longitude];
        if (userMarker) map.removeLayer(userMarker);
        if (userCircle) map.removeLayer(userCircle);
        userMarker = L.marker(latlng).addTo(map).bindPopup('現在地').openPopup();
        userCircle = L.circle(latlng, { radius: pos.coords.accuracy || 30, color:'#1f6fff', fillColor:'#66a2ff', fillOpacity:0.15 }).addTo(map);
        map.setView(latlng, 15, {animate:true});
        updateStatus();
      }, (err) => {
        alert('現在地を取得できませんでした。位置情報の許可を確認してください。');
        updateStatus();
      }, { enableHighAccuracy:true, timeout:10000, maximumAge:0 });
    }

    renderList();
    loadPins();
    window.toggleDone = toggleDone;
    window.centerOn = centerOn;
    window.locateUser = locateUser;
    window.toggleDrawer = toggleDrawer;
  </script>
</body>
</html>
