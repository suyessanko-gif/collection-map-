<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>9/21 回収マップ（11件）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f3f4f6}
#map{position:fixed;inset:0}
.panel{position:fixed;z-index:1000;top:10px;left:10px;right:10px;background:rgba(255,255,255,.97);border-radius:16px;box-shadow:0 4px 16px #0003;padding:12px 132px 10px 12px}
.title{font-weight:900;font-size:20px;line-height:1.2}.sub{font-size:12px;line-height:1.45;color:#444;margin-top:5px}.status{font-size:12px;color:#24406e;background:#eef4ff;border-radius:9px;padding:8px 10px;margin-top:8px}
.topBtns{position:fixed;z-index:1002;right:18px;top:18px;display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;box-shadow:0 2px 8px #0002}.blue{background:#1677ff;color:#fff}.dark{background:#444;color:#fff}.white{background:#fff;color:#111}
.gpsFab{position:fixed;right:14px;bottom:22px;z-index:1001;border:0;border-radius:24px;background:#1677ff;color:#fff;font-weight:900;font-size:19px;padding:16px 18px;box-shadow:0 4px 14px #0004}
.drawer{position:fixed;z-index:1200;left:0;top:0;bottom:0;width:min(90vw,420px);background:#fff;transform:translateX(-105%);transition:.2s;box-shadow:4px 0 18px #0004;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}.drawerHead{padding:14px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}.drawerHead b{font-size:20px}.list{overflow:auto;padding:10px}
.item{border:1px solid #ddd;border-radius:12px;padding:10px;margin-bottom:9px;background:#fff}.item.done{background:#ecfff1;border-color:#8bd09b}.row{display:flex;gap:10px;align-items:flex-start}.num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;flex:0 0 34px;background:#e53935}.num.yellow{background:#f4c20d;color:#111}.main{flex:1;min-width:0}.name{font-weight:850;font-size:15px}.addr{font-size:13px;line-height:1.4;color:#333;margin-top:3px}.building{font-size:12px;color:#666;margin-top:2px}.actions{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}.small{border:0;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:750}.nav{background:#e8f1ff;color:#075ec8}.doneBtn{background:#e8f7e8;color:#176b17}
.marker{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;border:2px solid #fff;box-shadow:0 2px 7px #0006;background:#e53935}.marker.yellow{background:#f4c20d;color:#111}.marker.done{background:#23a559;color:#fff}
.overlay{position:fixed;inset:0;z-index:1100;background:#0004;display:none}.overlay.show{display:block}
@media(max-width:600px){.panel{padding-right:116px}.title{font-size:18px}.btn{padding:9px 12px;font-size:14px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel"><div class="title">9/21 回収マップ（11件）</div><div class="sub">上から順に①〜⑪。①〜⑩は赤ピン、⑪西野さんは黄色ピン。GPS・Googleマップナビ・回収済み切替付き。ピンは最初から11件すべて表示します。</div><div class="status" id="status">11件の固定ピンを表示しました。住所位置を自動で微調整中…</div></div>
<div class="topBtns"><button class="btn blue" onclick="locateMe()">GPS</button><button class="btn dark" onclick="openList()">一覧</button><button class="btn white" onclick="hidePanel()">閉じる</button></div>
<button class="gpsFab" onclick="locateMe()">GPS</button>
<div class="overlay" id="overlay" onclick="closeList()"></div>
<aside class="drawer" id="drawer"><div class="drawerHead"><b>回収先一覧</b><button class="btn white" style="box-shadow:none;border:1px solid #ddd" onclick="closeList()">閉じる</button></div><div class="list" id="list"></div></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const jobs=[
  {
    "no": 1,
    "name": "松本（マツモト）",
    "addr": "熊本市西区小島6-1-16",
    "building": "",
    "lat": 32.7708,
    "lon": 130.6389,
    "color": "red"
  },
  {
    "no": 2,
    "name": "江夏（エナツ）",
    "addr": "熊本市西区池上町524",
    "building": "池上団地2C-5",
    "lat": 32.7907,
    "lon": 130.6698,
    "color": "red"
  },
  {
    "no": 3,
    "name": "石村（イシムラ）",
    "addr": "熊本市西区池田2-4-17",
    "building": "",
    "lat": 32.8208,
    "lon": 130.6924,
    "color": "red"
  },
  {
    "no": 4,
    "name": "石村（イシムラ）",
    "addr": "熊本市西区池田2-4-17",
    "building": "",
    "lat": 32.821,
    "lon": 130.6927,
    "color": "red"
  },
  {
    "no": 5,
    "name": "高島（タカシマ）",
    "addr": "熊本市西区蓮台寺4丁目15-2",
    "building": "ヴォルフスガルテン熊本駅南A棟",
    "lat": 32.7814,
    "lon": 130.6748,
    "color": "red"
  },
  {
    "no": 6,
    "name": "水野（ミズノ）",
    "addr": "熊本市西区春日7-15-50",
    "building": "春日スカイマンション",
    "lat": 32.789,
    "lon": 130.6784,
    "color": "red"
  },
  {
    "no": 7,
    "name": "倉谷（クラタニ）",
    "addr": "熊本市西区上熊本2丁目7-28",
    "building": "ロマネスク上熊本2",
    "lat": 32.8174,
    "lon": 130.6987,
    "color": "red"
  },
  {
    "no": 8,
    "name": "南阪（ミナミサカ）",
    "addr": "熊本市西区戸坂町5-2",
    "building": "",
    "lat": 32.8004,
    "lon": 130.6735,
    "color": "red"
  },
  {
    "no": 9,
    "name": "太田（オオタ）",
    "addr": "熊本市西区横手5-4-5",
    "building": "アミティエ",
    "lat": 32.8042,
    "lon": 130.6842,
    "color": "red"
  },
  {
    "no": 10,
    "name": "林田（ハヤシダ）",
    "addr": "熊本市西区花園5丁目10-3",
    "building": "井芹団地",
    "lat": 32.8171,
    "lon": 130.6908,
    "color": "red"
  },
  {
    "no": 11,
    "name": "西野（ニシノ）",
    "addr": "熊本市西区二本木2-6-1",
    "building": "エステージア熊本駅前",
    "lat": 32.794,
    "lon": 130.684,
    "color": "yellow"
  }
];
const doneKey='collection_map_2026_0921_done';
let done=JSON.parse(localStorage.getItem(doneKey)||'{}');
const map=L.map('map').setView([32.795,130.682],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const markers={}; let meMarker=null, meCircle=null;
function iconFor(j){let cls='marker'+(j.color==='yellow'?' yellow':'')+(done[j.no]?' done':'');return L.divIcon({className:'',html:`<div class="${cls}">${j.no}</div>`,iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-18]})}
function fullAddr(j){return j.addr+(j.building?' '+j.building:'')}
function navUrl(j){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(fullAddr(j))+'&travelmode=driving'}
function popup(j){return `<b>${j.no}. ${j.name}</b><br>${j.addr}${j.building?'<br>'+j.building:''}<br><br><a href="${navUrl(j)}" target="_blank">Googleマップでナビ</a><br><br><button onclick="toggleDone(${j.no})">${done[j.no]?'未回収に戻す':'回収済み'}</button>`}
function addFixedPins(){const b=[];jobs.forEach(j=>{const m=L.marker([j.lat,j.lon],{icon:iconFor(j)}).addTo(map).bindPopup(popup(j));markers[j.no]=m;b.push([j.lat,j.lon]);});map.fitBounds(b,{padding:[45,45]})}
function renderList(){const el=document.getElementById('list');el.innerHTML='';jobs.forEach(j=>{const d=document.createElement('div');d.className='item'+(done[j.no]?' done':'');d.innerHTML=`<div class="row"><div class="num ${j.color==='yellow'?'yellow':''}">${j.no}</div><div class="main"><div class="name">${j.name}</div><div class="addr">${j.addr}</div>${j.building?`<div class="building">${j.building}</div>`:''}<div class="actions"><button class="small nav" onclick="focusPin(${j.no})">地図で見る</button><a class="small nav" style="text-decoration:none" target="_blank" href="${navUrl(j)}">ナビ開始</a><button class="small doneBtn" onclick="toggleDone(${j.no})">${done[j.no]?'未回収に戻す':'回収済み'}</button></div></div></div>`;el.appendChild(d)})}
window.focusPin=n=>{const m=markers[n];if(m){map.setView(m.getLatLng(),17,{animate:true});m.openPopup();closeList()}};
window.toggleDone=n=>{done[n]=!done[n];localStorage.setItem(doneKey,JSON.stringify(done));const j=jobs.find(x=>x.no===n);markers[n].setIcon(iconFor(j));markers[n].setPopupContent(popup(j));renderList()};
window.openList=()=>{document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show')};
window.closeList=()=>{document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show')};
window.hidePanel=()=>document.getElementById('panel').style.display='none';
window.locateMe=()=>{if(!navigator.geolocation)return alert('この端末ではGPSが使えません');navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(meMarker)map.removeLayer(meMarker);if(meCircle)map.removeLayer(meCircle);meMarker=L.marker(ll).addTo(map).bindPopup('現在地').openPopup();meCircle=L.circle(ll,{radius:p.coords.accuracy||30,color:'#1677ff',fillColor:'#66a2ff',fillOpacity:.15}).addTo(map);map.setView(ll,16)},()=>alert('現在地を取得できませんでした。位置情報の許可を確認してください。'),{enableHighAccuracy:true,timeout:10000,maximumAge:0})};
async function gsi(q){const r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q));if(!r.ok)throw 0;const a=await r.json();if(a&&a[0]&&a[0].geometry&&a[0].geometry.coordinates){const [lon,lat]=a[0].geometry.coordinates;return [lat,lon]}throw 0}
async function refine(){let ok=0;for(const j of jobs){try{const ll=await gsi(j.addr);if(ll){// duplicate address 3/4: keep both visible with slight offset
let lat=ll[0],lon=ll[1];if(j.no===4){lat+=0.00012;lon+=0.00012}markers[j.no].setLatLng([lat,lon]);j.lat=lat;j.lon=lon;ok++;}}catch(e){}await new Promise(r=>setTimeout(r,180))}const b=jobs.map(j=>[j.lat,j.lon]);map.fitBounds(b,{padding:[45,45]});document.getElementById('status').textContent=`11件すべて表示中。住所位置を自動確認できたのは ${ok}/11件です。`;}
addFixedPins();renderList();refine();
</script>
</body></html>
