<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>9/21 回収マップ（11件）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#map{position:fixed;inset:0;background:#dfe7ee}
.panel{position:fixed;z-index:1000;top:12px;left:12px;right:12px;background:rgba(255,255,255,.96);border-radius:16px;padding:12px 120px 10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.title{font-size:19px;font-weight:900} .sub{font-size:12px;margin-top:4px;line-height:1.4;color:#444}
.status{margin-top:8px;padding:8px 10px;background:#eef4ff;border-radius:10px;font-size:12px;color:#1e3a5f}
.topBtns{position:fixed;z-index:1001;top:20px;right:20px;display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;box-shadow:0 2px 8px #0002}
.blue{background:#2878f0;color:white} .dark{background:#444;color:white} .white{background:white;color:#111}
.drawer{position:fixed;z-index:1300;left:0;top:0;bottom:0;width:min(92vw,430px);background:white;transform:translateX(-105%);transition:.2s;box-shadow:4px 0 20px #0004;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)} .drawerHead{padding:14px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
.list{overflow:auto;padding:10px} .item{border:1px solid #ddd;border-radius:12px;padding:10px;margin-bottom:8px}
.row{display:flex;gap:10px} .num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#dc2626;color:white;font-weight:900}
.num.yellow{background:#facc15;color:#111} .main{flex:1} .name{font-weight:900} .addr,.building{font-size:13px;line-height:1.4;margin-top:2px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px} .small{border:0;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;text-decoration:none}
.nav{background:#2563eb;color:white} .done{background:#e5e7eb;color:#111}
.pin{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#dc2626;color:#fff;font-weight:900;border:3px solid #fff;box-shadow:0 2px 8px #0005}
.pin.yellow{background:#facc15;color:#111} .pin.done{background:#16a34a!important;color:white}
.overlay{position:fixed;inset:0;z-index:1290;background:#0005;display:none} .overlay.show{display:block}
.leaflet-control-zoom{margin-bottom:28px!important}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel">
  <div class="title">9/21 回収マップ（11件）</div>
  <div class="sub">①〜⑩は赤、⑪西野さんは黄色。GPS・Googleマップナビ・回収済み切替付き。</div>
  <div class="status" id="status">地図を読み込み中…</div>
</div>
<div class="topBtns">
  <button class="btn blue" id="gpsBtn">GPS</button>
  <button class="btn dark" id="listBtn">一覧</button>
  <button class="btn white" id="closePanel">閉じる</button>
</div>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawerHead"><b>回収一覧（11件）</b><button class="btn white" id="closeList">閉じる</button></div>
  <div class="list" id="list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const jobs = [{"no": 1, "name": "松本（マツモト）", "addr": "熊本市西区小島6-1-16", "building": "", "lat": 32.7708, "lon": 130.6352, "color": "red"}, {"no": 2, "name": "江夏（エナツ）", "addr": "熊本市西区池上町524", "building": "池上団地2C-5-101", "lat": 32.7885, "lon": 130.6573, "color": "red"}, {"no": 3, "name": "石村（イシムラ）", "addr": "熊本市西区池田2-4-17", "building": "", "lat": 32.8208, "lon": 130.6924, "color": "red"}, {"no": 4, "name": "石村（イシムラ）", "addr": "熊本市西区池田2-4-17", "building": "", "lat": 32.821, "lon": 130.6927, "color": "red"}, {"no": 5, "name": "高島（タカシマ）", "addr": "熊本市西区蓮台寺4丁目15-2", "building": "ヴォルフスガルテン熊本駅南A棟 404号", "lat": 32.7814, "lon": 130.6748, "color": "red"}, {"no": 6, "name": "水野（ミズノ）", "addr": "熊本市西区春日7-15-50", "building": "308", "lat": 32.789, "lon": 130.6784, "color": "red"}, {"no": 7, "name": "倉谷（クラタニ）", "addr": "熊本市西区上熊本2丁目7-28", "building": "ロマネスク上熊本2 403号", "lat": 32.8174, "lon": 130.6987, "color": "red"}, {"no": 8, "name": "南阪（ミナミサカ）", "addr": "熊本市西区戸坂町5-2", "building": "", "lat": 32.8004, "lon": 130.6735, "color": "red"}, {"no": 9, "name": "太田（オオタ）", "addr": "熊本市西区横手5-4-5", "building": "アミティエ101", "lat": 32.8042, "lon": 130.6842, "color": "red"}, {"no": 10, "name": "林田（ハヤシダ）", "addr": "熊本市西区花園5丁目10-3", "building": "井芹団地 503号", "lat": 32.8171, "lon": 130.6908, "color": "red"}, {"no": 11, "name": "西野（ニシノ）", "addr": "熊本市西区二本木2-6-1", "building": "エステージア熊本駅前", "lat": 32.794, "lon": 130.684, "color": "yellow"}];
const doneKey='collection_map_2026_0921_leaflet_done';
let done=JSON.parse(localStorage.getItem(doneKey)||'{}');
let map, markers={}, meMarker=null;

function iconFor(j){
  return L.divIcon({
    className:'',
    html:`<div class="pin ${j.color==='yellow'?'yellow':''} ${done[j.no]?'done':''}">${j.no}</div>`,
    iconSize:[40,40],iconAnchor:[20,20],popupAnchor:[0,-20]
  });
}
function fullAddr(j){return j.addr+(j.building?' '+j.building:'')}
function navUrl(j){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(fullAddr(j))+'&travelmode=driving'}

function popupHtml(j){
  return `<b>${j.no}. ${j.name}</b><br>${j.addr}${j.building?'<br>'+j.building:''}<br><br>
  <a href="${navUrl(j)}" target="_blank" style="display:inline-block;background:#2563eb;color:white;padding:8px 10px;border-radius:9px;text-decoration:none;font-weight:700">Googleマップでナビ</a>
  <button onclick="toggleDone(${j.no})" style="margin-left:6px;border:0;padding:8px 10px;border-radius:9px;font-weight:700">${done[j.no]?'未回収に戻す':'回収済み'}</button>`;
}
function toggleDone(no){
  done[no]=!done[no];
  localStorage.setItem(doneKey,JSON.stringify(done));
  const j=jobs.find(x=>x.no===no);
  if(markers[no]){markers[no].setIcon(iconFor(j));markers[no].setPopupContent(popupHtml(j));}
  renderList();
}
window.toggleDone=toggleDone;

function renderList(){
  const list=document.getElementById('list'); list.innerHTML='';
  jobs.forEach(j=>{
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div class="row"><div class="num ${j.color==='yellow'?'yellow':''}">${j.no}</div><div class="main"><div class="name">${j.name}</div><div class="addr">${j.addr}</div>${j.building?`<div class="building">${j.building}</div>`:''}<div class="actions"><button class="small nav" data-focus="${j.no}">地図で見る</button><a class="small nav" target="_blank" href="${navUrl(j)}">ナビ開始</a><button class="small done" data-done="${j.no}">${done[j.no]?'未回収に戻す':'回収済み'}</button></div></div></div>`;
    list.appendChild(d);
  });
  list.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const no=+b.dataset.focus; map.setView(markers[no].getLatLng(),17); markers[no].openPopup(); closeDrawer();});
  list.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>toggleDone(+b.dataset.done));
}

function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function init(){
  if(typeof L==='undefined'){
    document.getElementById('status').textContent='地図ライブラリを読み込めません。GitHub公開ページで開いてください。';
    return;
  }
  map=L.map('map',{touchZoom:true,dragging:true,scrollWheelZoom:true,zoomControl:true,tap:false}).setView([32.795,130.678],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

  const bounds=[];
  jobs.forEach(j=>{
    const m=L.marker([j.lat,j.lon],{icon:iconFor(j)}).addTo(map);
    m.bindPopup(popupHtml(j));
    markers[j.no]=m; bounds.push([j.lat,j.lon]);
  });
  map.fitBounds(bounds,{padding:[55,55]});
  document.getElementById('status').textContent='11件のピンを表示中。二本指で拡大・縮小できます。';
  renderList();

  document.getElementById('gpsBtn').onclick=()=>{
    if(!navigator.geolocation){alert('この端末ではGPSが使えません');return}
    document.getElementById('status').textContent='現在地を取得中…';
    navigator.geolocation.getCurrentPosition(p=>{
      const ll=[p.coords.latitude,p.coords.longitude];
      if(meMarker) meMarker.setLatLng(ll); else meMarker=L.circleMarker(ll,{radius:9,color:'#2563eb',weight:3,fillColor:'#60a5fa',fillOpacity:.9}).addTo(map).bindPopup('現在地');
      map.setView(ll,16); meMarker.openPopup();
      document.getElementById('status').textContent='現在地を表示しました。';
    },()=>{document.getElementById('status').textContent='現在地を取得できません。位置情報の許可を確認してください。'},{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  };
  document.getElementById('listBtn').onclick=()=>{document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show')};
  document.getElementById('closeList').onclick=closeDrawer;
  document.getElementById('overlay').onclick=closeDrawer;
  document.getElementById('closePanel').onclick=()=>document.getElementById('panel').style.display='none';
}
window.addEventListener('load',init);
</script>
</body>
</html>
